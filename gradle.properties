# Configuración global de Gradle optimizada
# Asigna 4 GB de RAM a Gradle y activa la recolección de basura paralela
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Habilita la compilación en paralelo para procesar múltiples módulos a la vez
org.gradle.parallel=true

# Activa la caché de configuración para reutilizar datos de compilaciones previas
org.gradle.configuration-cache=true

# Activa la caché de compilación general de Gradle
org.gradle.caching=true

# Mantener las configuraciones nativas de Android de tu proyecto
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
